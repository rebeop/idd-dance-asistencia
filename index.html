<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDD Dance · Asistencia</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8D2C4;--g1:#EDDCCF;--g2:#CDB1AB;--card:rgba(247,239,231,.8);--field:rgba(232,210,196,.55);--dlg:#F3E7DD;--ink:#3E3239;--muted:#6B5560;--line:rgba(107,85,96,.24);--ac:#6B5560;--soft:rgba(107,85,96,.12);--soft2:rgba(107,85,96,.07);--hi:#9E8189;--on:#F7EFE7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2d2429;--g1:#4b3c44;--g2:#2a2025;--card:rgba(158,129,137,.16);--field:rgba(0,0,0,.2);--dlg:#3E3239;--ink:#F7EFE7;--muted:#C7A9A3;--line:rgba(232,210,196,.18);--ac:#E8D2C4;--soft:rgba(232,210,196,.12);--soft2:rgba(232,210,196,.05);--hi:#C7A9A3;--on:#3E3239}}
:root[data-theme="dark"]{--bg:#2d2429;--g1:#4b3c44;--g2:#2a2025;--card:rgba(158,129,137,.16);--field:rgba(0,0,0,.2);--dlg:#3E3239;--ink:#F7EFE7;--muted:#C7A9A3;--line:rgba(232,210,196,.18);--ac:#E8D2C4;--soft:rgba(232,210,196,.12);--soft2:rgba(232,210,196,.05);--hi:#C7A9A3;--on:#3E3239}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg) linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%) fixed;min-height:100vh;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;padding-bottom:120px;-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:var(--soft2);z-index:-1}
body::before{width:420px;height:420px;right:-190px;top:340px}
body::after{width:340px;height:340px;left:-170px;bottom:90px}
/* cabecera */
header{position:relative;overflow:hidden;color:#fff;background:linear-gradient(155deg,#9E8189 0%,#6B5560 40%,#3E3239 100%);border-radius:0 0 50% 50%/0 0 34px 34px;padding:22px 20px 70px}
#ondas{position:absolute;inset:0;width:100%;height:100%}
#ondas path{fill:none;stroke:#E8D2C4;stroke-width:.8;opacity:.32}
.hin{position:relative;max-width:640px;margin:0 auto}
.lg{display:inline-block}
.lg img{display:block;height:54px;width:auto;filter:drop-shadow(0 2px 8px rgba(20,10,16,.35))}
.chapa{display:inline-block;margin:26px 0 0;background:#E8D2C4;border-radius:16px;padding:5px 26px 0;box-shadow:0 12px 30px rgba(30,20,26,.45),0 0 0 4px rgba(232,210,196,.2)}
.chapa b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:.05em;color:#3E3239;background:linear-gradient(100deg,#3E3239,#6B5560);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.vers{margin:22px 0 0;max-width:28em;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:22px;line-height:1.3;color:#E8D2C4}
.orn{display:flex;align-items:center;gap:10px;margin-top:16px;max-width:210px;color:#E8D2C4}.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}.orn i:last-child{background:linear-gradient(90deg,currentColor,transparent)}.orn svg{width:12px;height:12px}
.cita{margin:9px 0 0;font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:#F7EFE7;opacity:.92}
main{position:relative;max-width:640px;margin:-44px auto 0;padding:0 16px}
h2.sec{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;margin:22px 4px 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ac),transparent)}
.card{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(62,50,57,.12)}
label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
input{font:inherit;width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);margin-bottom:14px}
select{font:inherit;width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);margin-bottom:14px}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--soft)}
.btn{font:inherit;font-weight:800;letter-spacing:.04em;background:linear-gradient(135deg,#6B5560,#3E3239);color:#F7EFE7;border:0;border-radius:30px;padding:15px 20px;cursor:pointer;width:100%;box-shadow:0 10px 24px rgba(62,50,57,.35);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--ac);border:1.5px solid var(--ac);box-shadow:none}
/* selector de fecha */
.sel{display:flex;align-items:center;gap:10px}
.flecha{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ac);display:grid;place-items:center;cursor:pointer}
.flecha svg{width:18px;height:18px}
.fechaw{position:relative;flex:1;text-align:center}
.fechaw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.fechaw small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.fechaw b{font-family:'Barlow Condensed',sans-serif;font-size:30px;line-height:1.1;font-weight:700;text-transform:capitalize;display:block}
.estado{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.14em;text-indent:.14em;text-transform:uppercase;font-weight:800;padding:5px 13px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.estado.ok{color:var(--ac);border-color:var(--ac);background:var(--soft)}
.anillo{display:flex;align-items:center;gap:16px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.anillo svg{flex:none;width:84px;height:84px;transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-width:7;stroke-linecap:round}
.anillo .f{stroke:var(--line)}
.anillo .v{stroke:var(--ac);stroke-dasharray:226;transition:stroke-dashoffset .5s cubic-bezier(.3,.8,.3,1)}
.num{position:relative}
.num b{font-family:'Barlow Condensed',sans-serif;font-size:46px;line-height:1;font-weight:700;color:var(--ac)}
.num span{font-size:13px;color:var(--muted);font-weight:600}
.num p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bus{position:relative}
.bus svg{position:absolute;left:15px;top:14px;width:18px;height:18px;color:var(--muted)}
.bus input{padding-left:44px;margin:0}
/* filas */
.fila{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;margin-bottom:9px;cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s}
.fila.ent{animation:sube .45s both}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fila.on{border-color:var(--ac);background:var(--soft);box-shadow:0 6px 18px rgba(62,50,57,.16)}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--ac);background:var(--card);border:1.5px solid var(--hi);box-shadow:0 0 0 3px var(--soft)}
.nom{flex:1;min-width:0;font-weight:700;line-height:1.25}
.pres{flex:none;display:flex;align-items:center;justify-content:center;min-width:120px;text-indent:.06em;font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;padding:9px 15px;border-radius:30px;border:1.5px solid var(--line);background:transparent;color:var(--muted);transition:all .18s;pointer-events:none}
.pres svg{width:0;height:15px;margin-right:0;opacity:0;transition:all .18s}
.fila.on .pres{background:var(--ac);border-color:var(--ac);color:var(--on)}
.fila.on .pres svg{width:15px;margin-right:7px;opacity:1}
.guardar{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-top:8px}
/* constancia */
.stat{display:flex;gap:6px;text-align:center}
.stat div{flex:1}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:42px;line-height:1;font-weight:700;color:var(--ac)}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.meses{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.mes{font:inherit;flex:none;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:capitalize;padding:10px 18px;border-radius:30px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.mes.act{background:var(--ac);border-color:var(--ac);color:var(--on)}
details{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px;margin-bottom:9px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
.info{flex:1;min-width:0;font-weight:700}
.info small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.pct{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--ac)}
.barra{height:6px;background:var(--line);border-radius:6px;margin-top:12px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--hi),var(--ac))}
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;margin-top:12px}
.dia{text-align:center;padding:9px 4px;border-radius:12px;font-size:11px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.dia b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--ink);letter-spacing:.03em}
.dia.p{background:var(--soft);border-color:var(--ac);color:var(--ac)}
/* datos */
.ficha{display:flex;gap:14px}
.ficha h3{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;letter-spacing:.02em;margin:0 0 8px}
.ficha dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:7px 10px;font-size:13px}
.ficha dt{color:var(--muted);font-weight:600}.ficha dd{margin:0;font-weight:700}
.salir{position:absolute;top:22px;right:18px;z-index:2;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#F7EFE7;background:rgba(247,239,231,.14);border:1px solid rgba(247,239,231,.38);border-radius:30px;padding:9px 15px;cursor:pointer}
.err{min-height:18px;margin:-4px 0 12px;font-size:13px;font-weight:700;color:#d6506b}
.mini{margin:0 0 16px;font-size:13px;color:var(--muted);font-weight:600}
.dos{display:flex;gap:10px;margin-bottom:8px}.dos .btn{flex:1}
.form{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.fl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.ch{font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;padding:8px 14px;border-radius:30px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.ch svg{width:0;height:13px;margin-right:0;opacity:0;transition:all .18s}
.ch.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.ch.on svg{width:13px;margin-right:6px;opacity:1}
.enc{font:inherit;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:10px}
.enc b{font-size:13px;letter-spacing:.04em;color:var(--ink)}
.enc.on{border-color:var(--ac);background:var(--soft)}.enc.on b{color:var(--ac)}
.del{font:inherit;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:10px 0 0}
/* navegación */
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:612px;margin:0 auto;display:flex;gap:4px;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:0 14px 36px rgba(30,20,26,.28)}
nav button{flex:1;font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;border:0;background:none;color:var(--muted);padding:9px 4px;border-radius:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s}
nav svg{width:22px;height:22px}
nav button.act{color:var(--on);background:var(--ac)}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:30px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:all .25s}
.toast.v{opacity:1;transform:translate(-50%,0)}
dialog{max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:26px;padding:24px;width:min(92vw,420px);background:var(--dlg);color:var(--ink)}
dialog::backdrop{background:rgba(25,17,21,.62)}
dialog h2{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;text-transform:uppercase;margin:0 0 16px;color:var(--ac)}
.vacio{text-align:center;color:var(--muted);padding:26px 0;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// ondas decorativas de la cabecera
(function(){
  var p = '';
  for(var i = 0; i < 34; i++){
    var d = '';
    for(var x = 0; x <= 640; x += 8){
      var y = 40 + i*5.2 + Math.sin(x/95 + i*.11) * (28 - i*.55) + Math.sin(x/38 - i*.2) * 3.5;
      d += (x ? ' L' : 'M') + x + ' ' + y.toFixed(1);
    }
    p += '<path d="'+d+'"/>';

  document.getElementById('ondas').innerHTML = p;
})();

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function proxSab(){ var d = new Date(); d.setDate(d.getDate() + (6 - d.getDay() + 7) % 7); return d; }
function esc(t){ var x = document.createElement('div'); x.textContent = t; return x.innerHTML; }
function F(s,o){ return new Date(s+'T12:00:00').toLocaleDateString('es-PY',o); }
function iniciales(n){ return n.split(' ').filter(Boolean).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase(); }
function mover(dias){ var d = new Date(fecha+'T12:00:00'); d.setDate(d.getDate() + dias); fecha = iso(d); }
function v(i){ return document.getElementById(i).value.trim(); }
var fecha = iso(proxSab());

function edad(nac){
  var n = new Date(nac+'T12:00:00'), h = new Date(), e = h.getFullYear() - n.getFullYear();
  if(h.getMonth() < n.getMonth() || (h.getMonth() == n.getMonth() && h.getDate() < n.getDate())) e--;
  return e;
}
function tiempo(desde){
  if(!desde) return '-';
  var p = desde.split('-'), h = new Date(), m = (h.getFullYear() - +p[0]) * 12 + (h.getMonth() + 1 - +p[1]);
  if(m < 1) return 'Menos de 1 mes';
  var a = Math.floor(m/12), r = m % 12, t = [];
  if(a) t.push(a + (a==1 ? ' año' : ' años'));
  if(r) t.push(r + (r==1 ? ' mes' : ' meses'));
  return t.join(' y ');
}
function aviso(t){ var e = document.getElementById('toast'); e.textContent = t; e.classList.add('v'); setTimeout(function(){ e.classList.remove('v'); }, 2200); }
function fallo(e){ console.error(e); aviso('No se pudo guardar. Revisá tu conexión.'); refrescarTodo(); }

/* ---------- Datos en Supabase ---------- */
function aDan(r){
  return {id:r.id, nombre:r.nombre, nac:r.nacimiento, gp:r.lider_gp || '', desde:r.congrega_desde || '', tel:r.telefono || '',
          mnvc:r.mnvc, m1:r.m1, m2:r.m2, m3:r.m3, enc:r.encuentro || ''};
}
// trae todas las filas de a 1000 (el límite de Supabase por consulta)
async function traer(tabla, cols, orden){
  var out = [], de = 0, paso = 1000;
  while(true){
    var q = db.from(tabla).select(cols);
    orden.forEach(function(o){ q = q.order(o); });
    var r = await q.range(de, de + paso - 1);
    if(r.error) throw r.error;
    out = out.concat(r.data);
    if(r.data.length < paso) break;
    de += paso;
  }
  return out;
}
async function cargar(){
  var r = await Promise.all([
    traer('danzoras', '*', ['nombre','id']),
    traer('sesiones', 'fecha', ['fecha']),
    traer('presentes', 'fecha,danzora_id', ['fecha','danzora_id'])
  ]);
  S.dan = r[0].map(aDan);
  S.asis = {};
  r[1].forEach(function(s){ S.asis[s.fecha] = {}; });
  r[2].forEach(function(p){ (S.asis[p.fecha] = S.asis[p.fecha] || {})[p.danzora_id] = true; });
  listo = true;
}
async function marcar(f, id, on){
  pend++;
  try{
    if(on){
      var a = await db.from('sesiones').upsert({fecha:f}, {onConflict:'fecha', ignoreDuplicates:true});
      if(a.error) throw a.error;
      var b = await db.from('presentes').upsert({fecha:f, danzora_id:id}, {onConflict:'fecha,danzora_id', ignoreDuplicates:true});
      if(b.error) throw b.error;
    } else {
      var c = await db.from('presentes').delete().eq('fecha', f).eq('danzora_id', id);
      if(c.error) throw c.error;
    }
    pend--;
  }catch(e){ pend--; fallo(e); }
}
async function refrescarTodo(){
  if(!listo || pend > 0 || document.hidden) return;
  try{ await cargar(); }catch(e){ return; }
  if(pend > 0) return;
  if(tab == 'asis' && document.getElementById('lista')) lista();
  else if(tab == 'const') vistaConst();
  else if(tab == 'datos' && document.getElementById('fichas')) fichas();
}
// actualiza la lista del día cada 15 segundos (para ver lo que marcan otras líderes)
setInterval(async function(){
  if(!listo || tab != 'asis' || pend > 0 || document.hidden || !document.getElementById('lista')) return;
  var f = fecha;
  var a = await db.from('sesiones').select('fecha').eq('fecha', f);
  var b = await db.from('presentes').select('danzora_id').eq('fecha', f);
  if(a.error || b.error || pend > 0 || f != fecha) return;
  if(a.data.length || b.data.length){ S.asis[f] = {}; b.data.forEach(function(p){ S.asis[f][p.danzora_id] = true; }); }
  else delete S.asis[f];
  lista();
}, 15000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refrescarTodo(); });

/* ---------- Constancia (por mes) ---------- */
function vistaConst(){
  var todas = Object.keys(S.asis).sort().reverse(), meses = [];
  todas.forEach(function(d){ var m = d.slice(0,7); if(meses.indexOf(m) < 0) meses.push(m); });
  if(!mes || meses.indexOf(mes) < 0) mes = meses[0] || '';
  var fechas = todas.filter(function(d){ return d.slice(0,7) == mes; }), n = fechas.length, suma = 0;
  var filas = S.dan.map(function(p){
    var vi = 0, dias = '';
    fechas.forEach(function(d){
      var ok = !!S.asis[d][p.id]; if(ok) vi++;
      dias += '<div class="dia'+(ok?' p':'')+'"><b>'+F(d,{day:'numeric',month:'short'})+'</b>'+(ok?'Presente':'Ausente')+'</div>';
    });
    var pct = n ? Math.round(vi*100/n) : 0; suma += pct;
    return '<details><summary><div class="av">'+iniciales(p.nombre)+'</div><div class="info">'+esc(p.nombre)+
      '<small>'+vi+' presentes · '+(n-vi)+' ausentes</small></div><div class="pct">'+pct+'%</div></summary>'+
      '<div class="barra"><i style="width:'+pct+'%"></i></div><div class="dias">'+dias+'</div></details>';
  });
  var prom = S.dan.length ? Math.round(suma / S.dan.length) : 0;
  main.onclick = function(e){ var b = e.target.closest('.mes'); if(b){ mes = b.dataset.m; vistaConst(); } };
  main.innerHTML = '<div class="meses">'+meses.map(function(m){ return '<button class="mes'+(m==mes?' act':'')+'" data-m="'+m+'">'+F(m+'-01',{month:'long',year:'numeric'})+'</button>'; }).join('')+'</div>'+
    '<div class="card stat"><div><b>'+n+'</b><span>Ensayos del mes</span></div><div><b>'+S.dan.length+'</b><span>Danzoras</span></div><div><b>'+prom+'%</b><span>Promedio del mes</span></div></div>'+
    '<h2 class="sec">Por danzora</h2>'+(filas.join('') || '<div class="vacio">Todavía no hay asistencia registrada.</div>');
}

/* ---------- Importar desde Excel (CSV) ---------- */
function norm(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); }
var COL = {nombre:'nombre', nombreyapellido:'nombre', danzora:'nombre', fechadenacimiento:'nac', fechanacimiento:'nac', nacimiento:'nac',
  liderdegp:'gp', lidergp:'gp', gp:'gp', secongregadesde:'desde', congregadesde:'desde', desde:'desde',
  telefono:'tel', celular:'tel', mnvc:'mnvc', m1:'m1', m2:'m2', m3:'m3', encuentro:'enc'};
function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/, '');
  var primera = txt.split(/\r?\n/)[0] || '';
  var sep = (primera.split(';').length > primera.split(',').length) ? ';' : ',';
  var filas = [], fila = [], cel = '', q = false;
  for(var i = 0; i < txt.length; i++){
    var c = txt[i];
    if(q){ if(c == '"'){ if(txt[i+1] == '"'){ cel += '"'; i++; } else q = false; } else cel += c; }
    else if(c == '"') q = true;
    else if(c == sep){ fila.push(cel); cel = ''; }
    else if(c == '\n' || c == '\r'){ if(c == '\r' && txt[i+1] == '\n') i++; fila.push(cel); cel = ''; filas.push(fila); fila = []; }
    else cel += c;
  }
  if(cel !== '' || fila.length){ fila.push(cel); filas.push(fila); }
  return filas.filter(function(f){ return f.some(function(x){ return x.trim() !== ''; }); });
}
function dos(n){ return ('0' + n).slice(-2); }
function fechaOK(s){
  var m, r = '';
  if(m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) r = m[1] + '-' + dos(m[2]) + '-' + dos(m[3]);
  else if(m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/)) r = m[3] + '-' + dos(m[2]) + '-' + dos(m[1]);
  if(!r) return '';
  var d = new Date(r + 'T12:00:00');
  return (!isNaN(d) && iso(d) == r) ? r : '';
}
function desdeOK(s){
  var m;
  s = (s || '').trim();
  if(m = s.match(/^(\d{4})-(\d{1,2})$/)) return m[1] + '-' + dos(m[2]);
  if(m = s.match(/^(\d{1,2})[\/.\-](\d{4})$/)) return m[2] + '-' + dos(m[1]);
  if(m = s.match(/^(\d{4})$/)) return m[1] + '-01';
  return '';
}
function si(x){ var n = norm(x); return n == 'si' || n == 's' || n == 'x' || n == '1' || n == 'true' || n == 'verdadero' || n == 'hecho' || /[✓✔]/.test(x || ''); }
function encOK(x){ var n = norm(x); if(n == 'danzora' || n == 'ella' || n == 'd') return 'danzora'; if(n == 'padres' || n == 'padre' || n == 'p') return 'padres'; return ''; }
function modelo(){
  var t = '\uFEFFnombre;fecha de nacimiento;líder de GP;se congrega desde;teléfono;MNVC;M1;M2;M3;encuentro\r\nMaría Pérez;14/03/2008;Carolina Acosta;05/2019;0981 111 222;si;si;;;danzora\r\n';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], {type:'text/csv;charset=utf-8'}));
  a.download = 'planilla-danzoras.csv'; a.click();
}
async function importar(file){
  try{
    var buf = await file.arrayBuffer(), txt;
    try{ txt = new TextDecoder('utf-8', {fatal:true}).decode(buf); }catch(e){ txt = new TextDecoder('windows-1252').decode(buf); }
    var f = parseCSV(txt);
    if(f.length < 2){ alert('La planilla está vacía o no tiene filas.'); return; }
    var enc = f[0].map(function(h){ return COL[norm(h)] || ''; });
    if(enc.indexOf('nombre') < 0 || enc.indexOf('nac') < 0){ alert('Faltan las columnas "nombre" y "fecha de nacimiento". Descargá la planilla modelo para ver cómo se arma.'); return; }
    var ok = [], mal = [], dup = 0, ya = {};
    S.dan.forEach(function(p){ ya[norm(p.nombre) + '|' + p.nac] = 1; });
    f.slice(1).forEach(function(c, i){
      var o = {}; enc.forEach(function(k, j){ if(k) o[k] = (c[j] || '').trim(); });
      var nac = fechaOK(o.nac || '');
      if(!o.nombre || !nac){ mal.push('Fila ' + (i+2) + (o.nombre ? ' (' + o.nombre + ')' : '')); return; }
      var clave = norm(o.nombre) + '|' + nac;
      if(ya[clave]){ dup++; return; }
      ya[clave] = 1;
      ok.push({nombre:o.nombre, nacimiento:nac, lider_gp:o.gp || null, congrega_desde:desdeOK(o.desde) || null, telefono:o.tel || null,
               mnvc:si(o.mnvc), m1:si(o.m1), m2:si(o.m2), m3:si(o.m3), encuentro:encOK(o.enc)});
    });
    var msg = 'Se van a agregar ' + ok.length + ' danzoras.' + (dup ? '\n' + dup + ' ya estaban cargadas y se saltean.' : '') +
      (mal.length ? '\n\nNo se pueden importar (falta el nombre o la fecha de nacimiento está mal):\n' + mal.slice(0,10).join('\n') + (mal.length > 10 ? '\n...' : '') : '');
    if(!ok.length){ alert(msg); return; }
    if(!confirm(msg + '\n\n¿Continuar?')) return;
    aviso('Importando...');
    for(var i = 0; i < ok.length; i += 200){
      var r = await db.from('danzoras').insert(ok.slice(i, i + 200));
      if(r.error){ fallo(r.error); return; }
    }
    await cargar(); fichas(); aviso('Importación lista: ' + ok.length + ' danzoras');
  }catch(e){ fallo(e); }
}
